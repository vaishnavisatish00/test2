<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration | DOM & jQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div id="form-container" class="col-md-6 border p-4 shadow bg-white">
            <h2 class="text-center mb-4" id="main-heading">Student Registration</h2>
            
            <div class="text-center mb-3">
                <img id="profile-img" src="https://via.placeholder.com/100" class="rounded-circle" alt="Profile">
                <br>
                <button type="button" id="change-img-btn" class="btn btn-sm btn-secondary mt-2">Change Avatar</button>
            </div>

            <form id="regForm">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control user-input" placeholder="Username">
                </div>
                <div class="mb-3">
                    <input type="text" id="email" class="form-control user-input" placeholder="Email (e.g. abc@xyz.com)">
                </div>
                <div class="mb-3">
                    <input type="text" id="phone" class="form-control user-input" placeholder="Phone Number (10 digits)">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control user-input" placeholder="Password">
                </div>
                <div class="mb-3">
                    <input type="password" id="confirmPassword" class="form-control user-input" placeholder="Confirm Password">
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Register Student</button>
                    <button type="button" id="dom-demo-btn" class="btn btn-warning">DOM Manipulation Demo</button>
                </div>
            </form>
            
            <div id="message-area" class="mt-3"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
